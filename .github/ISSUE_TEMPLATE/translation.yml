name: "🌐 Translation"
description: Offer or improve a translation of Saath
title: "[Translation] "
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Tamil, Spanish, Bengali
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What would you like to do?
      options:
        - Translate Saath into a new language
        - Fix or improve an existing translation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For a fix, paste the current text and your suggested wording.
